<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rishta Biodata</title>
  <link rel="icon" type="image/png" href="/rishta-logo.png" />
  <link rel="apple-touch-icon" href="/rishta-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700;800&amp;display=swap" />
  <style>
    :root {
      --ink: #0A2540;
      --ink-muted: #6C7793;
      --accent: #9A3324;
      --accent-deep: #7D2A1D;
      --surface: #FFFFFF;
      --surface-warm: #FAF6F2;
      --hairline: rgba(10, 37, 64, 0.12);
      --hairline-strong: rgba(10, 37, 64, 0.18);
      --frame-max: 1280px;
    }

    html {
      scroll-behavior: smooth;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--surface);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Wrapper that holds the gradient behind both nav and hero */
    .canvas {
      position: relative;
      isolation: isolate;
      background: var(--surface);
    }

    .canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 48% 52% at 92% -6%, rgba(244, 184, 63, 0.72), transparent 64%),
        radial-gradient(ellipse 46% 58% at 96% 28%, rgba(233, 75, 123, 0.58), transparent 68%),
        radial-gradient(ellipse 42% 54% at 80% 68%, rgba(154, 51, 36, 0.40), transparent 68%),
        radial-gradient(ellipse 58% 60% at 4% 90%, rgba(250, 226, 202, 0.60), transparent 64%),
        linear-gradient(90deg, #fff 0%, rgba(255, 255, 255, 0.86) 42%, rgba(255, 253, 251, 0.3) 100%);
      filter: blur(18px) saturate(1.05);
      pointer-events: none;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: 72px;
      display: flex;
      align-items: center;
      background: transparent;
      border-bottom: 1px solid var(--hairline);
      transition: border-color 0.25s ease, min-height 0.3s ease;
    }

    .nav:hover,
    .nav:focus-within,
    .nav.is-scrolled {
      border-color: transparent;
    }

    .nav-frame {
      max-width: var(--frame-max);
      width: min(100%, var(--frame-max));
      margin: 0 auto;
      min-height: 72px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      background: transparent;
      border-left: 1px solid var(--hairline);
      border-right: 1px solid var(--hairline);
      border-top: 1px solid transparent;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      box-shadow: none;
      transition:
        background-color 0.3s ease,
        border-color 0.3s ease,
        border-radius 0.3s ease,
        box-shadow 0.3s ease,
        min-height 0.3s ease,
        width 0.3s ease;
    }

    .nav:hover .nav-frame,
    .nav:focus-within .nav-frame,
    .nav.is-scrolled .nav-frame {
      width: min(calc(100% - 48px), calc(var(--frame-max) - 32px));
      min-height: 64px;
      background: var(--surface);
      border-color: rgba(10, 37, 64, 0.08);
      border-radius: 8px;
      box-shadow:
        0 18px 44px rgba(10, 37, 64, 0.10),
        0 2px 10px rgba(10, 37, 64, 0.06);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 44px;
      min-width: 0;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Sora', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: #000000;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-brand img {
      height: 32px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 15px;
      color: #000000;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 14px;
      min-height: 38px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }

    .btn:focus { outline: none; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn svg.arrow {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--accent);
      border-color: var(--hairline);
    }

    .btn-secondary:hover {
      background: var(--surface-warm);
      border-color: rgba(154, 51, 36, 0.28);
      color: var(--accent-deep);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-deep);
      border-color: var(--accent-deep);
    }

    .hero {
      position: relative;
      min-height: calc(100dvh - 61px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
      border-bottom: 1px solid var(--hairline);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 58% 48% at 50% 50%, rgba(255, 255, 255, 0.76) 0%, rgba(255, 255, 255, 0) 72%);
      pointer-events: none;
    }

    .hero-frame {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: var(--frame-max);
      margin: 0 auto;
      padding: 40px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1px solid var(--hairline);
      border-right: 1px solid var(--hairline);
    }

    .hero-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 88px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0;
      text-align: center;
      line-height: 1.05;
    }

    @media (max-width: 920px) {
      .nav {
        min-height: 64px;
      }

      .nav-frame {
        min-height: 64px;
        padding: 0 24px;
        gap: 18px;
      }

      .nav:hover .nav-frame,
      .nav:focus-within .nav-frame,
      .nav.is-scrolled .nav-frame {
        width: calc(100% - 32px);
        min-height: 58px;
      }

      .nav-left {
        gap: 0;
      }

      .nav-links {
        display: none;
      }

      .btn {
        min-height: 40px;
        padding: 8px 13px;
        font-size: 14px;
      }

      .hero {
        min-height: calc(100dvh - 65px);
      }

      .hero-frame {
        padding: 32px 24px;
        border-left: 0;
        border-right: 0;
      }

      .hero-title {
        font-size: 64px;
      }
    }

    @media (max-width: 560px) {
      .nav-frame {
        padding: 0 18px;
      }

      .nav:hover .nav-frame,
      .nav:focus-within .nav-frame,
      .nav.is-scrolled .nav-frame {
        width: calc(100% - 20px);
      }

      .nav-brand {
        font-size: 21px;
      }

      .btn-secondary {
        display: none;
      }

      .hero-title {
        font-size: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="canvas">
  <nav class="nav">
    <div class="nav-frame">
      <div class="nav-left">
        <a class="nav-brand" href="/">
          <img src="/rishta-logo.png" alt="Rishta logo" />
          Rishta
        </a>
        <ul class="nav-links">
          <li><a href="#steps">Steps</a></li>
          <li><a href="#testimonials">Testimonials</a></li>
          <li><a href="#faqs">FAQs</a></li>
          <li><a href="#resources">Resources</a></li>
        </ul>
      </div>
      <div class="nav-actions">
        <a class="btn btn-secondary" href="#templates">Templates</a>
        <a class="btn btn-primary" href="#create">Create biodata <svg class="arrow" viewBox="0 0 12 12"><polyline points="4 2 8 6 4 10"/></svg></a>
      </div>
    </div>
  </nav>
  <section class="hero">
    <div class="hero-frame"></div>
  </section>
  </div>
  <script>
    (function () {
      var nav = document.querySelector('.nav');
      var onScroll = function () {
        if (window.scrollY > 8) nav.classList.add('is-scrolled');
        else nav.classList.remove('is-scrolled');
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>
</body>
</html>
