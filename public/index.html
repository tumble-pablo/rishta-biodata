<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rishta Biodata</title>
  <style>
    :root {
      --ink: #0A2540;
      --ink-muted: #6C7793;
      --accent: #9A3324;
      --surface: #FFFFFF;
      --surface-warm: #FAF6F2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      color: var(--ink);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      background-color: var(--surface);
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 40%, var(--surface) 0%, var(--surface-warm) 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.5;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.04  0 0 0 0 0.02  0 0 0 0 0  0 0 0 0.35 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .hero-title {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.02em;
      text-align: center;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1 class="hero-title">Rishta Biodata</h1>
  </section>
</body>
</html>
